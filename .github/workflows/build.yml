name: Build and Deploy

on:
  push:
    branches: 
      - develop
      - main
      - 'release/**'
      - 'feature/**'
      - 'issue/**'
      - 'issues/**'
      - 'dependabot/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: '3.12'
  POETRY_VERSION: '2.3.2'
  TERRAFORM_VERSION: '1.12.2'
  CUMULUS_VERSION: 'v21.3.4'
  CUMULUS_NODE_VERSION: 'nodejs22.x'

jobs:

  build:
    if: always()
    name: Build and Test CLI Tool
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      packages: write
      id-token: write     # IMPORTANT: this permission is mandatory for trusted publishing

    outputs:  # Define outputs for this job
      target_env_uppercase: ${{ steps.set-env.outputs.target_env_uppercase }}
      target_env_lowercase: ${{ steps.set-env.outputs.target_env_lowercase }}
      new_version: ${{ steps.set-env.outputs.new_version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: abatilo/actions-poetry@v4
        with:
          poetry-version: ${{ env.POETRY_VERSION }}

      - name: Cache Poetry Dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Version Management
        id: versioning
        run: |
          current_version=$(poetry version -s)
          base_version=$(echo "$current_version" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
          
          # Version calculation based on branch
          if [[ "${{ github.ref }}" =~ ^refs/heads/(issue|feature|dependabot)/ ]]; then
            TIMESTAMP=$(date -u +"%Y%m%d%H%M")
            new_version="${base_version}a${TIMESTAMP}"
            echo "TARGET_ENV_UPPERCASE=SIT" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "TARGET_ENV_UPPERCASE=SIT" >> $GITHUB_ENV
            new_version=$(poetry version prerelease -s)
          elif [[ "${{ github.ref }}" =~ ^refs/heads/release/ ]]; then
            echo "TARGET_ENV_UPPERCASE=UAT" >> $GITHUB_ENV
            if [[ ${current_version} =~ rc ]]; then
              new_version=$(poetry version prerelease -s)
            else
              new_version="${GITHUB_REF#refs/heads/release/}rc1"
            fi
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "TARGET_ENV_UPPERCASE=OPS" >> $GITHUB_ENV
            new_version=${base_version}
          fi
          
          echo "new_version=${new_version}" >> $GITHUB_ENV

      - name: Override Environment for Deploy Command
        if: |
          github.event.head_commit.message == '/deploy sit' ||
          github.event.head_commit.message == '/deploy uat'
        run: |
          message="${{ github.event.head_commit.message }}"
          override_env=$(echo "$message" | grep -oE '/deploy (sit|uat)' | awk '{print $2}')
          if [[ -n "$override_env" ]]; then
            override_env_upper=$(echo "$override_env" | tr '[:lower:]' '[:upper:]')
            echo "TARGET_ENV_UPPERCASE=${override_env_upper}" >> $GITHUB_ENV
            echo "TARGET_ENV_LOWERCASE=${override_env}" >> $GITHUB_ENV
            echo "Overriding deployment target to: ${override_env_upper}"
          fi

      - name: Set Lowercase Environment
        run: |
          echo "TARGET_ENV_LOWERCASE=$(echo ${{ env.TARGET_ENV_UPPERCASE }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Update Package Version
        run: poetry version ${{ env.new_version }}

      - name: Build, Install and Test
        run: |
          poetry build
          poetry install
          poetry run pylint podaac
          poetry run flake8 podaac
          poetry run pytest --junitxml=build/reports/pytest.xml --cov=podaac/ --cov-report=html -m "not aws and not integration" tests/

      - name: Run Snyk Security Scan
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor
          args: >
            --org=${{ secrets.SNYK_ORG_ID }}
            --project-name=${{ github.repository }}
            --severity-threshold=high
            --fail-on=all

      - name: Commit Version Changes
        if: |
          github.ref == 'refs/heads/develop' ||
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/heads/release')
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "${GITHUB_ACTOR}"
            git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
            git commit -am "/version ${{ env.new_version }}"
            git tag -a "${{ env.new_version }}" -m "Version ${{ env.new_version }}"
            git push --follow-tags
          fi

      - name: Publish to test.pypi.org
        id: pypi-test-publish
        if: |
          github.ref == 'refs/heads/develop' ||
          startsWith(github.ref, 'refs/heads/release') ||
          github.event.head_commit.message == '/deploy sit' ||
          github.event.head_commit.message == '/deploy uat'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to pypi.org
        if: |
          github.ref == 'refs/heads/main'
        id: pypi-publish
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Set Environment Output
        id: set-env
        run: |
          echo "target_env_uppercase=${{ env.TARGET_ENV_UPPERCASE }}" >> $GITHUB_OUTPUT
          echo "target_env_lowercase=${{ env.TARGET_ENV_LOWERCASE }}" >> $GITHUB_OUTPUT
          echo "new_version=${{ env.new_version }}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        if: |
          github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.new_version }}  # Use the tag that triggered the action
          name: Release v${{ env.new_version }}
          draft: false
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}

  terraform-deploy:
    needs: [build]
    if: |
      github.ref == 'refs/heads/develop' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/release') ||
      github.event.head_commit.message == '/deploy sit' ||
      github.event.head_commit.message == '/deploy uat'
    name: Deploy Backend Infrastructure Terraform Carpathia
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      packages: write
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download and Extract Cumulus Zip
        id: download_cumulus_zip
        run: |
          set -euo pipefail

          CUMULUS_ZIP_URL="https://github.com/nasa/cumulus/releases/download/${CUMULUS_VERSION}/terraform-aws-cumulus.zip"
          mkdir -p /tmp/cumulus-unzip
          curl -L --fail --retry 3 --retry-delay 2 -o /tmp/terraform-aws-cumulus.zip "$CUMULUS_ZIP_URL"
          zip_listing=/tmp/cumulus-unzip/listing.txt
          unzip -Z1 /tmp/terraform-aws-cumulus.zip > "$zip_listing"

          extract_entry() {
            local pattern="$1"
            local destination="$2"
            local matched_entry

            matched_entry=$(grep -m1 -E "$pattern" "$zip_listing" || true)
            if [[ -z "$matched_entry" ]]; then
              echo "Expected entry not found in terraform-aws-cumulus.zip: $pattern" >&2
              exit 1
            fi
            unzip -p /tmp/terraform-aws-cumulus.zip "$matched_entry" > "$destination"
          }

          extract_entry 'tasks/post-to-cmr/dist/lambda\.zip$' terraform-deploy/post_to_cmr.zip
          extract_entry 'tasks/hyrax-metadata-updates/dist/lambda\.zip$' terraform-deploy/hyrax-metadata-updates.zip
          extract_entry 'tf-modules/cumulus/ecs_cluster_instance_autoscaling_user_data\.tmpl$' terraform-deploy/ecs_cluster_instance_autoscaling_user_data.tmpl
          extract_entry 'tf-modules/cumulus/task-reaper\.sh$' terraform-deploy/task-reaper.sh

          echo "cumulus_node_version=${{ env.CUMULUS_NODE_VERSION }}" >> "$GITHUB_OUTPUT"
         
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          
      - name: Deploy with Terraform
        working-directory: terraform-deploy/
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets[format('AWS_ACCESS_KEY_ID_SERVICES_{0}', needs.build.outputs.target_env_uppercase)] }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets[format('AWS_SECRET_ACCESS_KEY_SERVICES_{0}', needs.build.outputs.target_env_uppercase)] }}
          AWS_ACCOUNT_ID: ${{ secrets[format('AWS_ACCOUNT_ID_SERVICES_{0}', needs.build.outputs.target_env_uppercase)] }}
          AWS_DEFAULT_REGION: us-west-2
          TF_VAR_permissions_boundary_arn: ${{ secrets[format('PERMISSIONS_BOUNDARY_ARN_{0}', needs.build.outputs.target_env_uppercase)] }}
          TF_VAR_buckets_name: ${{ secrets[format('BUCKET_{0}', needs.build.outputs.target_env_uppercase)] }}
          TF_VAR_system_bucket: ${{ secrets[format('SYSTEM_BUCKET_{0}', needs.build.outputs.target_env_uppercase)] }}
          TF_VAR_dmrpp_url: ${{ secrets.DMRPP_URL }}
          TF_VAR_aws_security_group_ids: ${{ secrets[format('SECURITY_GROUP_IDS_{0}', needs.build.outputs.target_env_uppercase)] }}
          TF_VAR_cumulus_node_version: ${{ steps.download_cumulus_zip.outputs.cumulus_node_version }}
          TARGET_ENV: ${{ needs.build.outputs.target_env_lowercase }}
          COMMIT_URL: "https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          BRANCH_URL: "https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}"
        run: |

          curl -L -o metadata-aggregator.zip https://github.com/podaac/cumulus-metadata-aggregator/releases/download/v8.10.0/cumulus-metadata-aggregator-8.10.0.zip
          python3 override.py "$TARGET_ENV" "$COMMIT_URL" "$BRANCH_URL" "${{ needs.build.outputs.new_version }}"
          source bin/config.sh "$TARGET_ENV"

          terraform init
          terraform plan -var-file=tfvars/"$TARGET_ENV".tfvars -var="app_version=${{ needs.build.outputs.new_version }}" -out=tfplan
          terraform apply -auto-approve tfplan

  ansible-deploy:
    needs: [build]
    if: |
      github.ref == 'refs/heads/develop' ||
      startsWith(github.ref, 'refs/heads/release') ||
      github.event.head_commit.message == '/deploy sit' ||
      github.event.head_commit.message == '/deploy uat'
    name: Deploy Backend Infrastructure Terraform Services
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      packages: write
      
    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Create YAML file with version
        working-directory: carpathia/ansible/roles/hitide-backfill-tool/tasks/vars
        run: |
          echo "hitide_backfill_tool_version: \"${{ needs.build.outputs.new_version }}\"" > hitide.yml

      - name: Deploy Ansible
        working-directory: carpathia/terraform/
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets[format('AWS_ACCESS_KEY_ID_CUMULUS_{0}', needs.build.outputs.target_env_uppercase)] }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets[format('AWS_SECRET_ACCESS_KEY_CUMULUS_{0}', needs.build.outputs.target_env_uppercase)] }}
          AWS_ACCOUNT_ID: ${{ secrets[format('AWS_ACCOUNT_ID_CUMULUS_{0}', needs.build.outputs.target_env_uppercase)] }}
          AWS_DEFAULT_REGION: us-west-2
          TF_VAR_sns_backfill_arns: "\"${{ secrets[format('BACKFILL_SNS_SERVICES_{0}', needs.build.outputs.target_env_uppercase)] }}\""
          TARGET_ENV: ${{ needs.build.outputs.target_env_lowercase }}
        run: |
          source bin/config.sh "$TARGET_ENV"
          terraform init
          terraform plan -var-file=tfvars/"$TARGET_ENV".tfvars -out=tfplan
          terraform apply -auto-approve tfplan
